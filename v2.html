<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>홋카이도 단풍 4박5일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body>
<style>
@font-face{font-family:"PretendardV2";src:url("pret-v2.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  /* Layout: an iPhone app on phones (large titles, inset grouped lists, a floating Liquid Glass tab bar) that opens into an iPad-style two-column canvas with the tab bar floating at the top */
  --bg:#F2F2F7;--cell:#FFFFFF;--cell-2:#F2F2F7;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.07);--seg-on:#FFFFFF;
  --label:#000000;--label-2:rgba(60,60,67,.62);--label-3:rgba(60,60,67,.34);--sep:rgba(60,60,67,.18);
  --tint:#007AFF;--tint-soft:rgba(0,122,255,.10);
  --green:#34C759;--orange:#FF9500;--red:#FF3B30;--yellow:#FFCC00;--teal:#30B0C7;--indigo:#5856D6;--pink:#FF2D55;--brown:#A2845E;--gray:#8E8E93;--cyan:#32ADE6;--purple:#AF52DE;
  --ok-ink:#248A3D;--warn-ink:#C93400;--bad-ink:#D70015;
  --glass:rgba(249,249,251,.66);--glass-hi:rgba(255,255,255,.95);--glass-rim:rgba(0,0,0,.07);--lens:rgba(118,118,128,.15);--sheen:rgba(255,255,255,.5);
  --float:0 14px 40px rgba(0,0,0,.13),0 2px 6px rgba(0,0,0,.06);
  --sky-1:#2F6FC9;--sky-2:#73AEEA;--cloudy-1:#566C88;--cloudy-2:#93A7BE;--rainy-1:#3A4B62;--rainy-2:#687E96;
  --sky-glass:rgba(255,255,255,.16);--sky-line:rgba(255,255,255,.24);
  --pass-1:#101C36;--pass-2:#21375F;--live:#1C1C1E;
  --sun:#FFCC00;--cloud:#B5BCC7;--cloud2:#8A929E;--rain:#32ADE6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PretendardV2","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","PretendardV2","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PretendardV2","Apple SD Gothic Neo",sans-serif;
  --r:22px;--r-s:14px;--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--cell:#1C1C1E;--cell-2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.14);--seg-on:#636366;
  --label:#FFFFFF;--label-2:rgba(235,235,245,.6);--label-3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --tint:#0A84FF;--tint-soft:rgba(10,132,255,.2);
  --green:#30D158;--orange:#FF9F0A;--red:#FF453A;--yellow:#FFD60A;--teal:#40C8E0;--indigo:#5E5CE6;--pink:#FF375F;--brown:#AC8E68;--gray:#98989D;--cyan:#64D2FF;--purple:#BF5AF2;
  --ok-ink:#30D158;--warn-ink:#FF9F0A;--bad-ink:#FF6961;
  --glass:rgba(30,30,34,.58);--glass-hi:rgba(255,255,255,.17);--glass-rim:rgba(255,255,255,.09);--lens:rgba(255,255,255,.14);--sheen:rgba(255,255,255,.12);
  --float:0 14px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
  --sky-1:#0C1830;--sky-2:#22406E;--cloudy-1:#171E29;--cloudy-2:#3A4658;--rainy-1:#10161F;--rainy-2:#2B3747;
  --sky-glass:rgba(255,255,255,.08);--sky-line:rgba(255,255,255,.15);
  --pass-1:#15213F;--pass-2:#2A4170;--live:#2C2C2E;
  --sun:#FFD60A;--cloud:#8E96A4;--cloud2:#6B7380;--rain:#64D2FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--cell:#1C1C1E;--cell-2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.14);--seg-on:#636366;
  --label:#FFFFFF;--label-2:rgba(235,235,245,.6);--label-3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --tint:#0A84FF;--tint-soft:rgba(10,132,255,.2);
  --green:#30D158;--orange:#FF9F0A;--red:#FF453A;--yellow:#FFD60A;--teal:#40C8E0;--indigo:#5E5CE6;--pink:#FF375F;--brown:#AC8E68;--gray:#98989D;--cyan:#64D2FF;--purple:#BF5AF2;
  --ok-ink:#30D158;--warn-ink:#FF9F0A;--bad-ink:#FF6961;
  --glass:rgba(30,30,34,.58);--glass-hi:rgba(255,255,255,.17);--glass-rim:rgba(255,255,255,.09);--lens:rgba(255,255,255,.14);--sheen:rgba(255,255,255,.12);
  --float:0 14px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
  --sky-1:#0C1830;--sky-2:#22406E;--cloudy-1:#171E29;--cloudy-2:#3A4658;--rainy-1:#10161F;--rainy-2:#2B3747;
  --sky-glass:rgba(255,255,255,.08);--sky-line:rgba(255,255,255,.15);
  --pass-1:#15213F;--pass-2:#2A4170;--live:#2C2C2E;
  --sun:#FFD60A;--cloud:#8E96A4;--cloud2:#6B7380;--rain:#64D2FF;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.012em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-left:var(--gl);padding-right:var(--gr);padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0;padding:0}
ol,ul{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;letter-spacing:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 60%,transparent);outline-offset:2px;border-radius:10px}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}
.i.f{fill:currentColor;stroke:none}
.num,.tn{font-variant-numeric:tabular-nums}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-rim),var(--float)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(170deg,var(--sheen),transparent 46%)}

/* tab bar — bottom on phones, floating on top for wide screens */
.tabbar{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(430px,calc(100% - 32px));height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.tabbar button{position:relative;z-index:1;appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:28px;color:var(--label);cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:0}
.tabbar button .i{font-size:24px;stroke-width:1.8}
.tabbar button[aria-selected="true"]{color:var(--tint)}
.tabbar button[aria-selected="true"] .i{stroke-width:2.1}
.lens{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:28px;background:var(--lens);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.04)}
.tabbar.ready .lens{transition:transform .55s cubic-bezier(.3,1.35,.5,1),width .45s cubic-bezier(.3,1.35,.5,1)}

/* compact navigation bar, appears once the large title scrolls away */
.navbar{position:fixed;z-index:35;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);height:calc(48px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);box-shadow:0 .5px 0 var(--sep)}
body.scrolled .navbar{opacity:1}

/* ---------- page frame ---------- */
.app{max-width:1120px;margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.page{display:flex;flex-direction:column;gap:34px}
.lt{padding-top:14px;display:flex;flex-direction:column;gap:2px}
.lt-eye{font-size:13px;font-weight:600;color:var(--label-2);letter-spacing:0}
.lt h1{font-family:var(--font-d);font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-.025em}
.lt-sub{font-size:15px;color:var(--label-2)}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.sh{font-family:var(--font-d);font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-wrap:balance}
.sh small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--label-2);letter-spacing:0}
.sh3{font-size:13px;font-weight:600;color:var(--label-2);letter-spacing:.02em;padding:0 16px;text-transform:uppercase}
.sh-note{font-size:13px;color:var(--label-2);margin-top:-6px}
.fine{font-size:13px;line-height:1.5;color:var(--label-2);padding:0 16px}
.cols{display:grid;gap:34px}
.ink-warn{color:var(--warn-ink)}
.ink-tint{color:var(--tint)}

/* ---------- lists (inset grouped) ---------- */
.list{background:var(--cell);border-radius:var(--r);overflow:hidden}
.row{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;min-height:48px}
.row+.row::before,.list>li+li::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.list>li{position:relative}
.rb{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.rb b{font-weight:600;font-size:16px;line-height:1.35}
.rb p,.rb>span{font-size:15px;line-height:1.45;color:var(--label-2)}
.rb p b{font-size:inherit;color:var(--label)}
.ico{--c:var(--gray);width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:18px;margin-top:1px}
.ico .i{stroke-width:2.1}
.with-ico{--inset:58px}
.rowlink{display:flex;align-items:center;gap:8px;padding:13px 16px;color:var(--tint);font-weight:500;font-size:16px;position:relative}
.rowlink::before{content:"";position:absolute;top:0;right:0;left:16px;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.rowlink .grow{flex:1}
.rowlink:hover{background:var(--fill-2)}
.chev{color:var(--label-3);font-size:15px}

/* key/value rows */
.kv>div{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:11px 16px}
.kv>div+div::before{content:"";position:absolute;top:0;right:0;left:16px;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.kv dt{font-size:15px;color:var(--label-2);line-height:1.45}
.kv dd{font-size:15px;line-height:1.45;min-width:0}
.kv.wide>div{grid-template-columns:132px minmax(0,1fr)}
.kv.wide dt{color:var(--label);font-weight:600}
.kv.wide dd{color:var(--label-2)}

/* pills, chips, pay badges */
.pill{--c:var(--gray);--ink:var(--label-2);display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:600;line-height:1;padding:5px 9px 5px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.ok{--c:var(--green);--ink:var(--ok-ink)}.pill.warn{--c:var(--orange);--ink:var(--warn-ink)}.pill.bad{--c:var(--red);--ink:var(--bad-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--label-2);background:var(--cell);padding:7px 12px;border-radius:99px;line-height:1.3}
.chip .i{font-size:15px;color:var(--label)}
.mapchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:99px;background:var(--tint-soft);color:var(--tint);font-size:13px;font-weight:600;line-height:1.3}
.mapchip .i{font-size:14px}
.mapchip:hover{background:color-mix(in srgb,var(--tint) 18%,transparent)}
.pay{--c:var(--gray);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--label-2);line-height:1.35}
.pay::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pay.card{--c:var(--green)}.pay.cash{--c:var(--orange)}.pay.mix{--c:var(--yellow)}
.jp{font-size:13px;color:var(--label-3)}
.ops{font-size:13px;color:var(--label-2)}

/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:11px;background:var(--fill)}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-size:13px;font-weight:600;line-height:1.25;cursor:pointer;transition:background .2s,box-shadow .2s}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--label-2)}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* ---------- Today ---------- */
.story{position:relative;display:block;border-radius:28px;overflow:hidden;aspect-ratio:4/5;max-height:620px;width:100%;background:#2b2a1e;isolation:isolate;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.story img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.story:hover img{transform:scale(1.025)}
.story::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 42%)}
.story-top{position:absolute;z-index:2;top:0;left:0;right:0;padding:22px 22px 0;color:#fff}
.story-eye{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.82}
.story-title{font-family:var(--font-d);font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-.035em;margin-top:6px;text-wrap:balance;text-shadow:0 1px 18px rgba(0,0,0,.25)}
.story-bar{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;background:rgba(30,26,10,.32);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 .5px 0 rgba(255,255,255,.25)}
.appicon{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:26px;color:#fff;background:linear-gradient(150deg,#FFB340,#FF5E3A 70%,#E8384F);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.2)}
.appicon .i{stroke-width:2}
.story-meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.story-meta b{font-size:15px;font-weight:600}
.story-meta span{font-size:13px;opacity:.8}
.story-meta span b{font-size:13px}
.get{flex:none;font-size:15px;font-weight:700;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.92);color:#0A0A0A}

.live{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:24px;background:var(--live);color:#fff}
.live-ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(48,209,88,.18);color:#30D158;font-size:20px}
.live-b{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.live-b small{font-size:13px;color:rgba(255,255,255,.6)}
.live-b b{font-size:16px;font-weight:600}
.live-t{font-family:var(--font-r);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#30D158}
.live a{flex:none;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.16);padding:7px 12px;border-radius:99px}

/* boarding passes */
.passes{display:grid;gap:14px}
.pass{position:relative;border-radius:20px;color:#fff;background:linear-gradient(160deg,var(--pass-2),var(--pass-1));box-shadow:0 10px 30px rgba(16,28,54,.22);overflow:hidden}
.pass::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 100% 0%,rgba(120,170,255,.22),transparent 60%)}
.pass-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0;font-size:13px;font-weight:600}
.pass-h .air{display:inline-flex;align-items:center;gap:7px;letter-spacing:.02em}
.pass-h .air .i{font-size:16px}
.pass-h .dir{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14)}
.pass-r{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px 18px 16px}
.ap{display:flex;flex-direction:column;line-height:1.1}
.ap.r{text-align:right}
.code{font-family:var(--font-d);font-size:40px;font-weight:600;letter-spacing:.01em}
.city{font-size:13px;color:rgba(255,255,255,.66);margin-top:4px}
.pass-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;color:rgba(255,255,255,.75)}
.pass-mid .ln{height:0;border-top:1.5px dashed rgba(255,255,255,.35)}
.pass-mid .i{font-size:20px;color:#fff}
.pass-mid small{grid-column:1/-1;text-align:center;font-size:12px;margin-top:2px}
.pass-cut{position:relative;height:0;margin:0 18px;border-top:1.5px dashed rgba(255,255,255,.22)}
.pass-cut::before,.pass-cut::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.pass-cut::before{left:-29px}.pass-cut::after{right:-29px}
.pass-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:14px 18px 18px}
.pass-f dt{font-size:11px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.55)}
.pass-f dd{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* weather forecast card (Weather app daily list) */
.sky{--cloud:#FFFFFF;--cloud2:#D9E1EC;--rain:#7FD8FF;--sun:#FFD60A;position:relative;color:#fff;border-radius:var(--r);background:linear-gradient(170deg,var(--sky-1),var(--sky-2));overflow:hidden}
.sky.cloudy{background:linear-gradient(170deg,var(--cloudy-1),var(--cloudy-2))}
.sky.rainy{background:linear-gradient(170deg,var(--rainy-1),var(--rainy-2))}
.fc{display:flex;flex-direction:column;padding:4px 16px 8px}
.cap{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.62);padding:12px 0 10px;border-bottom:1px solid var(--sky-line)}
.cap .i{font-size:14px}
.cap .r{margin-left:auto;font-weight:500;letter-spacing:0;text-align:right}
.fc-row{appearance:none;border:0;background:none;color:inherit;width:100%;display:grid;grid-template-columns:62px 44px 34px minmax(40px,1fr) 34px;align-items:center;gap:8px;padding:9px 0;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.fc-row+.fc-row{border-top:1px solid var(--sky-line)}
.fc-row:hover .fc-d b{text-decoration:underline;text-underline-offset:3px}
.fc-d{display:flex;flex-direction:column;line-height:1.2}
.fc-d b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.fc-d small{font-size:12px;color:rgba(255,255,255,.62)}
.vd{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.vd.ok{background:#30D158}.vd.warn{background:#FFB340}.vd.bad{background:#FF6961}
.fc-i{display:flex;flex-direction:column;align-items:center;line-height:1}
.fc-i small{font-size:11px;font-weight:700;color:#7FD8FF;margin-top:1px}
.fc-lo{font-size:17px;font-weight:500;color:rgba(255,255,255,.62);text-align:right}
.fc-hi{font-size:17px;font-weight:600}
.rg{position:relative;height:5px;border-radius:3px;background:rgba(0,0,0,.18)}
.rg i{position:absolute;top:0;bottom:0;border-radius:3px}

/* horizontal scrollers */

// ---------- weather rendering ----------
function freshness(){if(WX.live)return '실시간 예보 · open-meteo';if(!WX.updated)return '예보 데이터 준비 중이에요.';const t=new Date(WX.updated).getTime();const o=jst(t);const s=`${o.m}/${o.d} ${String(o.h).padStart(2,'0')}:${String(o.mi).padStart(2,'0')} 업데이트 · ${WX.src||'MET Norway · 일본 기상청'}`;return phase==='after'?s+' · 여행 직전 예보 기록':((Date.now()-t)/3600e3>4?s+' · 오래된 예보일 수 있어요':s)}
function vrow(it,date){const j=judge(it,date),x=j.x;
 return `<li class="vrow">${icon(x?x.sym:null,38)}<div><p class="vt"><b>${esc(it.lb)}</b><span>${it.h[0]}–${it.h[1]}시</span></p>${x?`<p class="vn">${tRange(x)} · ${x.sl} · 강수 ${x.rain}mm${x.pop!=null?' · '+x.pop+'%':''} · 바람 ${x.wind}m/s</p>`:''}</div><span class="pill ${j.lv}">${esc(j.pl)}</span><p class="va">${esc(j.adv)}</p></li>`}
function fcCard(){const ag=PLAN.map(dayAgg);const has=ag.filter(a=>a.sym);const lo=Math.min(...has.map(a=>a.tmin)),hi=Math.max(...has.map(a=>a.tmax));const sev=Math.max(-1,...has.map(a=>a.sev));
 const rowsH=PLAN.map((d,i)=>{const a=ag[i],o=dOf(d.n);const lab={na:'예보 전',ok:'좋음',warn:'주의',bad:'대안'}[a.w];
  if(!a.sym)return `<button type="button" class="fc-row" data-wxgo="${d.n}"><span class="fc-d"><b><span class="vd"></span>${o.w}</b><small>${o.m}/${o.d}</small></span><span class="fc-i">${icon(null,26)}</span><span class="fc-lo">—</span><span class="rg"></span><span class="fc-hi">—</span></button>`;
  const L=(a.tmin-lo)/(hi-lo||1)*100,R=100-(a.tmax-lo)/(hi-lo||1)*100;
  return `<button type="button" class="fc-row" data-wxgo="${d.n}" aria-label="Day ${d.n} ${o.m}월 ${o.d}일 ${symOf(a.sym)[0]}, 최저 ${Math.round(a.tmin)}도 최고 ${Math.round(a.tmax)}도, 판단 ${lab}"><span class="fc-d"><b><span class="vd ${a.w}"></span>${o.w}</b><small>Day ${d.n}</small></span><span class="fc-i">${icon(a.sym,26)}${a.pop!=null&&a.pop>=20?`<small>${a.pop}%</small>`:''}</span><span class="fc-lo">${Math.round(a.tmin)}°</span><span class="rg"><i style="left:${L.toFixed(1)}%;right:${R.toFixed(1)}%;background:linear-gradient(90deg,${tcol(a.tmin)},${tcol(a.tmax)})"></i></span><span class="fc-hi">${Math.round(a.tmax)}°</span></button>`}).join('');
 return `<div class="sky ${skyClass(sev)}"><div class="fc"><p class="cap">${ic('cal')}5일간의 일기예보<span class="r">점 = 일정 판단</span></p>${rowsH}</div></div>`}
function hours(loc,date,hl){const [s,e]=winT(date,6,24);const R=inWin(loc,s,e);if(!R.length)return '';const nowT=Date.now();
 const cells=R.map(r=>{const o=jst(r.t);const pr=+r.pr||0;const perH=pr/r.dur;const hgt=Math.min(24,Math.round(perH/3*24))||(pr>0?2:0);const inw=hl&&o.h>=hl[0]-(r.dur>1?r.dur-1:0)&&o.h<hl[1];const isNow=nowT>=r.t&&nowT<r.t+r.dur*3600e3;
  return `<div class="hr${r.dur>1?' wide':''}${inw?' in':''}${isNow?' now':''}"><span class="h">${isNow?'지금':r.dur>1?`${o.h}–${Math.min(24,o.h+r.dur)}시`:`${o.h}시`}</span>${icon(r.sym,28)}<span class="t">${r.temp!=null?Math.round(r.temp)+'°':'—'}</span><span class="bar"><i style="height:${hgt}px"></i></span><span class="mm${pr>0?'':' z'}">${pr>0?pr+'mm':'0'}</span><span class="wd${(+r.wind||0)>=8?' s':''}">${r.wind!=null?Math.round(r.wind)+'m/s':''}</span></div>`}).join('');
 return `<div class="skycard"><p class="cap">${ic('clock')}${esc(LOC[loc])} · 시간별</p><div class="hours">${cells}</div></div>`}
function renderWx(sel){
 $$('[data-wxfresh]').forEach(e=>e.textContent=freshness());
 const fc=fcCard();['#fcToday','#fcWx'].forEach(s=>{const el=$(s);if(el)el.innerHTML=fc});
 $$('[data-wxday]').forEach(el=>{const d=PLAN.find(p=>p.n==el.dataset.wxday);el.innerHTML=d.items.map(it=>vrow(it,d.date)).join('')});
 const box=$('#wxbody');if(!box)return;const d=PLAN.find(p=>p.n==sel)||PLAN[0];const o=dOf(d.n);
 $$('[data-week="wx"] .wk button').forEach(b=>b.setAttribute('aria-selected',b.dataset.n==d.n));
 const a=dayAgg(d);const locs=[...new Set(d.items.map(i=>i.loc))];
 const head=`<div class="skyhero"><p class="loc">Day ${d.n} · ${o.m}월 ${o.d}일 ${o.w}요일</p>${a.sym?`<p class="tmp">${Math.round(a.tmax)}°</p><p class="cond">${symOf(a.sym)[0]}</p><p class="hl">최고 ${Math.round(a.tmax)}° · 최저 ${Math.round(a.tmin)}°${a.pop!=null?' · 강수확률 '+a.pop+'%':''}</p>`:'<p class="cond" style="margin-top:12px">이 날짜의 예보가 아직 없어요.</p>'}</div>`;
 box.innerHTML=`<div class="sky ${skyClass(a.sev??-1)}">${head}<div class="skybody"><div class="skycard"><p class="cap">${ic('cal')}일정별 판단</p><ul>${d.items.map(it=>vrow(it,d.date)).join('')}</ul></div>${locs.map(l=>hours(l,d.date,d.items.find(i=>i.loc===l).h)).join('')}<p class="skyleg">밝은 칸 = 일정 시간대 · 넓은 칸 = 6시간 단위(먼 날짜) · 막대 = 시간당 강수량</p></div></div>`}
const WMO=c=>c==0?'clearsky':c==1?'fair':c==2?'partlycloudy':c==3?'cloudy':(c==45||c==48)?'fog':(c>=51&&c<=57)?'lightrain':c==61?'lightrain':c==63?'rain':(c==65||c==66||c==67)?'heavyrain':(c>=71&&c<=77)?'snow':c==80?'lightrainshowers':c==81?'rainshowers':c==82?'heavyrainshowers':(c>=85&&c<=86)?'snow':c>=95?'rainandthunder':'cloudy';
async function tryLive(){try{const keys=Object.keys(LL);const u='https://api.open-meteo.com/v1/forecast?latitude='+keys.map(k=>LL[k][0]).join(',')+'&longitude='+keys.map(k=>LL[k][1]).join(',')+'&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,is_day&wind_speed_unit=ms&timezone=GMT&start_date=2026-09-24&end_date=2026-10-01';
 const ctl=new AbortController();setTimeout(()=>ctl.abort(),7000);const res=await fetch(u,{signal:ctl.signal});if(!res.ok)return false;let j=await res.json();if(!Array.isArray(j))j=[j];
 const loc={};keys.forEach((k,i)=>{const h=j[i]&&j[i].hourly;if(!h)return;loc[k]={u:new Date().toISOString(),r:h.time.map((t,n)=>[t+':00Z',h.temperature_2m[n],h.wind_speed_10m[n],h.precipitation[n],WMO(h.weather_code[n])+(h.is_day[n]?'_day':'_night'),h.precipitation_probability[n]])}});
 if(Object.keys(loc).length<4)return false;WX={live:true,updated:new Date().toISOString(),src:'open-meteo',loc,pop:{}};for(const k in CACHE)delete CACHE[k];return true}catch(e){return false}}

 const w=e.target.closest('[data-wxgo]');if(w){e.preventDefault();store.set('wxday',w.dataset.wxgo);show('wx');return}
 const k=e.target.closest('.wk button');if(k){const kind=k.closest('[data-week]').dataset.week;if(kind==='plan')showDay(+k.dataset.n);else{store.set('wxday',k.dataset.n);renderWx(+k.dataset.n)}return}
 const j=e.target.closest('[data-jump]');if(j){const t=document.getElementById(j.dataset.jump);t&&t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}
 const v=e.target.closest('.vbtn');if(v){const day=v.closest('.day');$$('.vbtn',day).forEach(x=>x.setAttribute('aria-pressed',x===v));$$('.vpanel',day).forEach(p=>p.hidden=p.dataset.v!==v.dataset.v);store.set('d2v2',v.dataset.v);return}
 const c=e.target.closest('.copy');if(c){const lab=$('span',c);const done=()=>{c.classList.add('done');lab.textContent='복사됨';setTimeout(()=>{c.classList.remove('done');lab.textContent='복사'},1500)};
  const sel=()=>{const n=c.parentElement.querySelector('.num');const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c.dataset.copy).then(done,sel)}else sel()}
});
{const v=store.get('d2v2');if(v){const b=$(`.vbtn[data-v="${v}"]`);b&&b.click()}}

// checklists (same keys as the current page, so ticks carry over)
function counts(){const left=s=>$$(s+' input').filter(i=>!i.checked).length;$('#todoN').textContent=left('#p-today .rem');$('#packN').textContent=left('#g-pack .rem')}
$$('.rem input').forEach(i=>{i.checked=store.get(i.dataset.k)==='1';i.addEventListener('change',()=>{store.set(i.dataset.k,i.checked?'1':'0');counts()})});counts();

// compact nav bar on scroll
function onScroll(){document.body.classList.toggle('scrolled',window.scrollY>56)}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',moveLens);

// first render
try{history.scrollRestoration='manual'}catch(e){}
renderWx(curDay||1);
const h=(location.hash||'').slice(1);
if(/^d[1-5]$/.test(h))show('plan',{day:+h.slice(1)});
else if(h==='prep'||h==='info'){show('guide');const t=$(h==='prep'?'#g-pay':'#g-call');t&&t.scrollIntoView()}
else if(TITLE[h])show(h);else show('today');
requestAnimationFrame(()=>{moveLens();requestAnimationFrame(()=>bar.classList.add('ready'))});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveLens);
tryLive().then(ok=>{if(ok)renderWx(+(store.get('wxday')||curDay||1))});
})();
</script>
