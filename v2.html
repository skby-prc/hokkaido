<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>홋카이도 단풍 4박5일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body>
<style>
@font-face{font-family:"PretendardV2";src:url("pret-v2.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  /* Layout: a product page in the apple.com manner: one long scroll of chapters on alternating white and light-grey bands, one dark band for weather, and every detail tucked behind a "+" sheet */
  --bg:#FFFFFF;--alt:#F5F5F7;--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#86868B;--line:#D2D2D7;--link:#0066CC;--btn:#0071E3;--chip:#E8E8ED;--sheet:#FFFFFF;--nav:rgba(255,255,255,.76);
  --dk:#000000;--dk-ink:#F5F5F7;--dk-2:#A1A1A6;--dk-line:#424245;--dk-card:#1D1D1F;--dk-link:#2997FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PretendardV2","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","PretendardV2","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sun:var(--ink);--cloud:var(--ink-3);--cloud2:var(--ink-2);--rain:var(--ink-2);
  --gl:max(22px,env(safe-area-inset-left,0px));--gr:max(22px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--alt:#161617;--ink:#F5F5F7;--ink-2:#A1A1A6;--ink-3:#86868B;--line:#424245;--link:#2997FF;--btn:#0071E3;--chip:#2C2C2E;--sheet:#1D1D1F;--nav:rgba(22,22,23,.76);
  --dk:#161617;--dk-ink:#F5F5F7;--dk-2:#A1A1A6;--dk-line:#424245;--dk-card:#232325;--dk-link:#2997FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--alt:#161617;--ink:#F5F5F7;--ink-2:#A1A1A6;--ink-3:#86868B;--line:#424245;--link:#2997FF;--btn:#0071E3;--chip:#2C2C2E;--sheet:#1D1D1F;--nav:rgba(22,22,23,.76);
  --dk:#161617;--dk-ink:#F5F5F7;--dk-2:#A1A1A6;--dk-line:#424245;--dk-card:#232325;--dk-link:#2997FF;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.016em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4,p,ol,ul,dl,dd,figure{margin:0;padding:0}
ol,ul{list-style:none}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;letter-spacing:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--btn);outline-offset:3px;border-radius:6px}
.tn{font-variant-numeric:tabular-nums}
.chev{display:inline-block;width:.5em;height:.5em;border-right:.12em solid currentColor;border-bottom:.12em solid currentColor;transform:rotate(-45deg);margin-left:.28em;vertical-align:.08em}

/* bands and the content column */
.band{background:var(--bg);padding-block:96px}
.band.alt{background:var(--alt)}
.w{max-width:1028px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.w.wide{max-width:1288px}
.center{text-align:center}
.eyebrow{font-size:17px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em}
.sh{font-family:var(--font-d);font-size:clamp(36px,6vw,64px);line-height:1.07;font-weight:600;letter-spacing:-.022em;text-wrap:balance}
.lede{font-family:var(--font-d);font-size:clamp(19px,2.2vw,24px);line-height:1.35;font-weight:600;color:var(--ink-2);letter-spacing:-.012em;max-width:680px;margin-top:14px;text-wrap:pretty}
.center .lede{margin-inline:auto}
.links{display:flex;flex-wrap:wrap;gap:8px 30px;font-size:19px;margin-top:22px}
.center .links{justify-content:center}
sup{font-size:.55em;vertical-align:.9em;line-height:0}
sup a{color:inherit}

/* local nav */
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.lnav-in{height:52px;display:flex;align-items:center;gap:20px}
.lnav-t{font-family:var(--font-d);font-size:21px;font-weight:600;color:var(--ink);letter-spacing:-.015em;margin-right:auto}
.lnav-t:hover{text-decoration:none}
.lnav-links{display:flex;gap:24px;font-size:12px}
.lnav-links a{color:var(--ink);opacity:.82}
.lnav-links a:hover{opacity:1;text-decoration:none;color:var(--link)}
.lnav-menu{display:none;appearance:none;border:0;background:none;width:32px;height:32px;cursor:pointer;color:var(--ink);border-radius:50%}
.lnav-menu .chev{transform:rotate(45deg);margin:0 0 4px;transition:transform .3s}
.lnav-menu[aria-expanded="true"] .chev{transform:rotate(225deg);margin:4px 0 0}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:400;color:#fff;background:var(--btn);padding:4px 11px;border-radius:99px;white-space:nowrap}
.pill:hover{text-decoration:none;background:#0077ED}
.pill.big{font-size:17px;padding:11px 22px}

/* hero */
.hero{padding-block:72px 0}
.hero h1{font-family:var(--font-d);font-size:clamp(56px,11vw,112px);line-height:1;font-weight:600;letter-spacing:-.03em;margin-top:10px}
.hero-sub{font-family:var(--font-d);font-size:clamp(24px,3.6vw,40px);line-height:1.15;font-weight:600;letter-spacing:-.02em;margin-top:12px}
.status{font-size:17px;color:var(--ink-2);margin-top:18px}
.status b{color:var(--ink);font-weight:600}
.hero-img{margin-top:56px;border-radius:28px;overflow:hidden;aspect-ratio:2/1;background:var(--alt)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.flights{display:grid;gap:40px;margin-top:64px;padding-bottom:96px}
.fl-eye{font-size:14px;font-weight:600;color:var(--ink-2)}
.fl-big{font-family:var(--font-d);font-size:clamp(44px,7vw,72px);line-height:1.05;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:8px}
.fl-big span{color:var(--ink-3);font-weight:300;margin:0 .12em}
.fl-sub{font-size:17px;color:var(--ink-2);margin-top:8px}

/* highlights gallery */
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:min(80vw,420px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:44px;padding-bottom:4px;padding-left:max(22px,env(safe-area-inset-left,0px),calc((100% - 980px)/2));padding-right:max(22px,env(safe-area-inset-right,0px),calc((100% - 980px)/2));scroll-padding-left:max(22px,env(safe-area-inset-left,0px),calc((100% - 980px)/2))}
.gal::-webkit-scrollbar{display:none}
.gc{position:relative;scroll-snap-align:start;display:block;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:#222;color:#fff;isolation:isolate}
.gc:hover{text-decoration:none}
.gc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.gc:hover img{transform:scale(1.03)}
.gc::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%)}
.gc-t{position:absolute;z-index:2;top:0;left:0;right:0;padding:28px 28px 0}
.gc-t small{display:block;font-size:14px;font-weight:600;opacity:.85}
.gc-t b{display:block;font-family:var(--font-d);font-size:26px;line-height:1.18;font-weight:600;letter-spacing:-.015em;margin-top:6px;text-wrap:balance}
.gal-nav{display:flex;justify-content:flex-end;gap:14px;margin-top:22px}
.paddle{appearance:none;border:0;width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:opacity .2s}
.paddle:disabled{opacity:.36;cursor:default}
.paddle .chev{margin:0}
.paddle.prev .chev{transform:rotate(135deg);margin-left:4px}
.paddle.next .chev{margin-right:4px}

/* principles */
.ethos{display:grid;gap:44px;margin-top:56px;text-align:left}
.ethos b{display:block;font-family:var(--font-d);font-size:clamp(32px,4.4vw,48px);line-height:1.1;font-weight:600;letter-spacing:-.02em}
.ethos p{font-size:17px;color:var(--ink-2);margin-top:12px;max-width:300px}

/* day chapters */
.chap .eyebrow{margin-bottom:8px}
.ch{font-family:var(--font-d);font-size:clamp(40px,6.4vw,72px);line-height:1.05;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.ch-sub{font-family:var(--font-d);font-size:clamp(19px,2.2vw,24px);font-weight:600;color:var(--ink-2);margin-top:14px;letter-spacing:-.012em}
.ch-img{margin-top:44px;border-radius:28px;overflow:hidden;aspect-ratio:16/9;background:var(--alt)}
.ch-img img{width:100%;height:100%;object-fit:cover}
.ch-grid{display:grid;gap:48px;margin-top:52px}
.hl li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:15px 0;border-top:1px solid var(--line);font-size:19px;line-height:1.35}
.hl li:last-child{border-bottom:1px solid var(--line)}
.hl .t{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:17px;padding-top:2px}
.hl .t small{font-size:14px}
.hl li.past{color:var(--ink-3)}
.hl li.next .t,.hl li.next .tw{color:var(--btn)}
.hl li.next .tw::after{content:"다음";font-size:12px;font-weight:600;margin-left:10px;vertical-align:2px}
.spec{display:grid;gap:0;align-content:start}
.spec>div{padding:15px 0;border-top:1px solid var(--line)}
.spec>div:last-child{border-bottom:1px solid var(--line)}
.spec dt{font-size:14px;font-weight:600;color:var(--ink-2)}
.spec dd{font-size:17px;margin-top:4px}
.spec dd small{display:block;font-size:14px;color:var(--ink-2);margin-top:3px}
.wxmini{display:flex;align-items:center;gap:10px}
.wxmini .wxi{flex:none}
.more{margin-top:40px}
.plus{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:12px;font-size:19px;font-weight:600;color:var(--ink);text-align:left}
.plus .pi{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;font-size:22px;font-weight:400;line-height:1;transition:transform .3s}
.plus:hover .pi{transform:scale(1.08)}

/* weather band */
.dark{background:var(--dk);color:var(--dk-ink);--sun:var(--dk-ink);--cloud:#8E8E93;--cloud2:#636366;--rain:var(--dk-ink)}
.dark .eyebrow,.dark .lede{color:var(--dk-2)}
.dark a{color:var(--dk-link)}
.fresh{font-size:14px;color:var(--dk-2);margin-top:22px}
.wxd{margin-top:52px;border-bottom:1px solid var(--dk-line)}
.wxd>li{border-top:1px solid var(--dk-line)}
.wxr{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 44px 112px 28px;align-items:center;gap:14px;padding:18px 0;cursor:pointer;text-align:left;color:inherit}
.wxr .d b{display:block;font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:-.015em}
.wxr .d small{display:block;font-size:14px;color:var(--dk-2);margin-top:2px}
.wxr .tt{font-family:var(--font-d);font-size:24px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.wxr .tt span{color:var(--dk-2);font-weight:400}
.wxr .ex{width:28px;height:28px;border-radius:50%;background:var(--dk-card);display:grid;place-items:center;font-size:18px;line-height:1;transition:transform .3s}
.wxr[aria-expanded="true"] .ex{transform:rotate(45deg)}
.wxp{padding:4px 0 30px;display:grid;gap:26px}
.vr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-top:1px solid var(--dk-line)}
.vr:first-child{border-top:0}
.vr b{font-size:17px;font-weight:600}
.vr .vh{font-size:14px;color:var(--dk-2);font-variant-numeric:tabular-nums}
.vr .vp{font-size:15px;font-weight:600;text-align:right}
.vr .vp.warn,.vr .vp.bad{color:#FFFFFF;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.vr .va{grid-column:1/-1;font-size:15px;color:var(--dk-2);line-height:1.5}
.hrs-h{font-size:14px;font-weight:600;color:var(--dk-2);margin-bottom:10px}
.hrs{display:grid;grid-auto-flow:column;grid-auto-columns:52px;overflow-x:auto;gap:4px;padding-bottom:8px;scrollbar-width:thin}
.hr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px;font-variant-numeric:tabular-nums}
.hr.wide{grid-column:span 2}
.hr.in{background:var(--dk-card)}
.hr .h{font-size:12px;color:var(--dk-2)}
.hr .t{font-size:17px;font-weight:600}
.hr .mm{font-size:11px;color:var(--dk-2)}
.hr .mm.r{color:var(--dk-ink);font-weight:600}
.hint{font-size:12px;color:var(--dk-2)}
.wx-links{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:40px;font-size:15px}

/* stays */
.picker{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:44px;padding-bottom:2px}
.picker::-webkit-scrollbar{display:none}
.picker button{appearance:none;flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:9px 18px;font-size:15px;cursor:pointer;color:var(--ink)}
.picker button small{color:var(--ink-2);margin-left:6px}
.picker button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.picker button[aria-selected="true"] small{color:inherit;opacity:.7}
.stay{margin-top:44px;display:grid;gap:34px}
.stay h3{font-family:var(--font-d);font-size:clamp(28px,3.6vw,40px);line-height:1.15;font-weight:600;letter-spacing:-.02em}
.stay .feat{font-size:19px;color:var(--ink-2);margin-top:10px}
.stay .ml{display:inline-block;font-size:17px;margin-top:16px}
.kv>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;padding:15px 0;border-top:1px solid var(--line)}
.kv>div:last-child{border-bottom:1px solid var(--line)}
.kv dt{font-size:15px;font-weight:600;color:var(--ink)}
.kv dd{font-size:17px;color:var(--ink-2);min-width:0}
.kv dd b{color:var(--ink);font-weight:600}
.kv dd a{white-space:nowrap}
.fnote{font-size:12px;color:var(--ink-2);margin-top:28px;line-height:1.5}

/* guide accordions */
.acc{margin-top:52px;border-bottom:1px solid var(--line)}
.acc details{border-top:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 0;font-family:var(--font-d);font-size:clamp(22px,2.8vw,28px);font-weight:600;letter-spacing:-.015em}
.acc summary::-webkit-details-marker{display:none}
.acc summary small{font-family:var(--font);font-size:15px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-left:10px}
.acc summary .pi{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;font-family:var(--font);font-size:20px;font-weight:400;transition:transform .3s}
.acc details[open] summary .pi{transform:rotate(45deg)}
.acc .body{padding:0 0 36px;display:grid;gap:28px}
.acc h4{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:-14px}
.acc .p{font-size:17px;color:var(--ink-2);max-width:680px}
.acc .p b{color:var(--ink)}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps .n{font-family:var(--font-d);font-size:28px;font-weight:300;color:var(--ink-3);line-height:1.1}
.steps b{display:block;font-size:17px;font-weight:600}
.steps p{font-size:15px;color:var(--ink-2);margin-top:3px}
.pt{width:100%;border-collapse:collapse;font-size:15px}
.pt th,.pt td{text-align:left;padding:13px 12px 13px 0;border-top:1px solid var(--line);vertical-align:top;font-weight:400}
.pt thead th{font-size:13px;font-weight:600;color:var(--ink-2);border-top:0;padding-top:0}
.pt tbody th{font-weight:600}
.pt td{color:var(--ink-2)}
.pt td.cash{color:var(--ink);font-weight:600}
.pt tr:last-child>*{border-bottom:1px solid var(--line)}
.ptwrap{overflow-x:auto}
.cl li{border-top:1px solid var(--line)}
.cl li:last-child{border-bottom:1px solid var(--line)}
.cl label{display:flex;gap:14px;align-items:flex-start;padding:14px 0;cursor:pointer}
.cl input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);margin:2px 0 0;flex:none;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.cl input::after{content:"";width:6px;height:11px;border-right:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.cl input:checked{background:var(--ink);border-color:var(--ink)}
.cl input:checked::after{opacity:1}
.cl .lb{font-size:17px;line-height:1.4}
.cl .lb small{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.cl input:checked~.lb{color:var(--ink-3)}
.cl.two{display:grid}
.ct li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}
.ct li:last-child{border-bottom:1px solid var(--line)}
.ct b{font-size:17px;font-weight:600}
.ct span{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.copy{appearance:none;border:0;background:none;color:var(--link);font-size:15px;cursor:pointer;padding:6px 0}
.rank li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.rank li:last-child{border-bottom:1px solid var(--line)}
.rank .n{font-family:var(--font-d);font-size:28px;font-weight:300;color:var(--ink-3);line-height:1.1}
.rank b{display:block;font-size:17px;font-weight:600}
.rank p{font-size:15px;color:var(--ink-2);margin-top:3px}

/* detail sheet */
.sheet{border:0;padding:0;margin:auto;width:calc(100% - 24px);max-width:880px;max-height:calc(100% - 48px);border-radius:28px;background:var(--sheet);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.sheet::backdrop{background:rgba(0,0,0,.48);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet[open]{animation:rise .42s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px)}to{transform:none}}
.sh-in{padding:64px 72px 72px}
.x{position:sticky;top:16px;float:right;margin:-48px -56px 0 0;appearance:none;border:0;width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--ink);cursor:pointer;font-size:22px;line-height:1;z-index:2}
.sheet h2{font-family:var(--font-d);font-size:clamp(32px,4.4vw,48px);line-height:1.08;font-weight:600;letter-spacing:-.022em;margin-top:8px;text-wrap:balance}
.sheet section{margin-top:52px}
.sheet h3{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:-.015em;margin-bottom:16px}
.decide{font-size:17px;color:var(--ink-2);margin-bottom:20px}
.decide b{color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;padding:3px;border-radius:99px;background:var(--chip);margin-bottom:22px}
.seg button{appearance:none;border:0;background:none;border-radius:99px;padding:8px 18px;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600}
.tl li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.tl li:last-child{border-bottom:1px solid var(--line)}
.tl .t{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px}

function rows(loc){if(CACHE[loc])return CACHE[loc];const L=(WX.loc||{})[loc];if(!L||!Array.isArray(L.r))return [];const r=L.r.filter(x=>x&&x[0]);
 const out=r.map((x,i)=>{const t=new Date(x[0]).getTime();const n=r[i+1]?new Date(r[i+1][0]).getTime():t+3600e3;const dur=Math.max(1,Math.min(6,Math.round((n-t)/3600e3)));return {t,dur,temp:x[1],wind:x[2],pr:x[3],sym:x[4],pop:x[5]??null}});return CACHE[loc]=out}
function winT(date,h0,h1){const [Y,M,D]=date.split('-').map(Number);return [Date.UTC(Y,M-1,D,h0)-JST,Date.UTC(Y,M-1,D,h1)-JST]}
function inWin(loc,s,e){return rows(loc).filter(r=>r.t<e&&r.t+r.dur*3600e3>s)}
function popJ(loc,s,e){const R=(WX.pop||{})[POPR[loc]]||[];let mx=null;R.forEach(([iso,p])=>{if(p==null)return;const t=new Date(iso).getTime();if(t<e&&t+6*3600e3>s)mx=Math.max(mx??0,+p)});return mx}
function stats(loc,date,h0,h1){const [s,e]=winT(date,h0,h1);const R=inWin(loc,s,e);if(!R.length)return null;
 let rain=0,rate=0,wind=0,tmin=99,tmax=-99,sev=-1,sym=null,coarse=false,pop=null;
 R.forEach(r=>{const ov=(Math.min(e,r.t+r.dur*3600e3)-Math.max(s,r.t))/3600e3;const p=+r.pr||0;rain+=p*ov/r.dur;rate=Math.max(rate,p/r.dur);wind=Math.max(wind,+r.wind||0);if(r.temp!=null){tmin=Math.min(tmin,r.temp);tmax=Math.max(tmax,r.temp)}const sv=symOf(r.sym)[1];if(sv>sev){sev=sv;sym=r.sym}if(r.dur>1)coarse=true;if(r.pop!=null)pop=Math.max(pop??0,r.pop)});
 const pj=popJ(loc,s,e);if(pj!=null)pop=Math.max(pop??0,pj);
 return {rain:Math.round(rain*10)/10,rate,wind:Math.round(wind*10)/10,tmin,tmax,sev,sym,sl:symOf(sym)[0],coarse,pop}}
function wetLevel(x){if(x.rain>=1||x.rate>=0.8||(x.pop??0)>=60||x.sev>=5)return 2;if(x.rain>=0.2||(x.pop??0)>=40||x.sev>=4)return 1;return 0}

 const cause=[w==2?'비 예보':w==1?'비 가능성':'',wd==2?'강풍':wd==1?'바람 강함':''].filter(Boolean).join('·');
 let adv='';

 case 'night': if(w==2){adv='비 예보 — Plan B: 9/29(화) 밤 노르베사 관람차 또는 Day 2 텐구야마로 미루기.'}else if(x.sev>=2||w==1){lv='warn';pl='주의';adv='구름·비로 야경이 가릴 수 있어요. 도착 전에 하늘 보고 결정.'}else adv='야경 보기 좋은 날씨예요. 리프트 위는 쌀쌀하니 겉옷.';break;
 case 'cruise': if(lvn==2){adv=cause+' — 승선장에 운항 여부 확인, 안 되면 운하 가스등 산책이나 숙소 휴식.'}else if(lvn==1){adv=cause+' — 물 위는 체감이 더 추워요. 겉옷 필수.'}else adv='해 질 무렵 크루즈에 좋은 날씨예요.';break;
 case 'rope': if(lvn==2){adv=cause+' — 운휴·시야 불량 가능성. Day 3 오후 막차로 당겨 타는 방안 검토, 당일 아침 운행 확인.'}else if(lvn==1){adv=cause+' — 로프웨이만 타고 리프트(7합목)는 건너뛰기.'}else adv='로프웨이 단풍 구경하기 좋은 날씨예요.';adv+=clothes(x);break;
 case 'biei': if(w>=1){adv='흐리거나 비가 오면 청의 호수 색이 덜 선명해요. 시라히게 폭포는 날씨와 상관없이 볼만함.'}else adv='청의 호수 색이 잘 보이는 날씨예요.';break;
 case 'fest': if(w==2){adv='비 예보 — 오텀페스트 대신 지하상가·실내 식당, 돈키호테는 아케이드라 괜찮아요.'}else if(w==1){adv='비 가능성 — 우산 챙기고 지붕 있는 좌석 위주로.'}else adv='축제 즐기기 좋은 날씨예요.';adv+=clothes(x);break;

 default: adv=w==2?'비 예보 — 우산·실내 대안.':w==1?'비 가능성 — 우산 챙기기.':'무난한 날씨예요.';adv+=clothes(x)}

function tRange(x){return Math.round(x.tmin)==Math.round(x.tmax)?`${Math.round(x.tmax)}°`:`${Math.round(x.tmin)}–${Math.round(x.tmax)}°`}
function dayAgg(d){const locs=[...new Set(d.items.map(i=>i.loc))];let tmin=99,tmax=-99,rain=0,pop=null,sev=-1,sym=null,any=false;

  <p class="lede" style="margin-inline:0">모두 예약을 마쳤어요. 매일 밤 온천에서 쉬어요.<sup><a href="#fn2">2</a></sup></p>
  <div class="picker" role="tablist" aria-label="숙소">${T.stays.map((s,i)=>{const o=dOf(i+1);return `<button type="button" role="tab" id="st-tab-${i}" aria-controls="st-${i}" aria-selected="${i===0}" data-st="${i}">${i+1}박 ${AREA[i]}<small>${o.m}/${o.d}</small></button>`}).join('')}</div>
  ${T.stays.map((s,i)=>`<div class="stay" role="tabpanel" id="st-${i}" aria-labelledby="st-tab-${i}"${i?' hidden':''}><div><h3>${esc(s.name)}</h3><p class="feat">${esc(s.feat)}</p><a class="ml" href="${esc(s.map)}" target="_blank" rel="noopener">지도에서 보기 ↗</a></div>${kv(s.rows)}</div>`).join('')}
 </div></section>`}

function guide(){
 const roleOf=h=>{const [a,b]=h.split(/<br\s*\/?>/);return b?`<b>${a.replace(/<[^>]+>/g,'').trim()}</b><br>${b.trim()}`:h};
 const byDay={};T.payTable.forEach(r=>(byDay[r.day]=byDay[r.day]||[]).push(r));
 const acc=(id,title,small,body,open)=>`<details id="${id}"${open?' open':''}><summary><span>${title}${small?`<small>${small}</small>`:''}</span><span class="pi" aria-hidden="true">+</span></summary><div class="body">${body}</div></details>`;
 const chk=(id,inner)=>`<li><label for="${id}"><input type="checkbox" id="${id}" data-k="${id}"><span class="lb">${inner}</span></label></li>`;
 return `<section class="band alt" id="prep"><div class="w">
  <p class="eyebrow">준비</p><h2 class="sh">떠나기 전에.</h2>
  <p class="lede" style="margin-inline:0">결제부터 연락처까지, 필요한 것만 모았어요.</p>
  <div class="acc">
   ${acc('g-pay',esc(T.payHead[0]),'',`<p class="p"><b>${esc(T.payHead[1].split(' — ')[0])}.</b> ${esc(T.payHead[1].split(' — ')[1]||'')}</p><h4>카드</h4>${kv(T.payCards.map(([k,v])=>[k,roleOf(v)]))}<h4>현금</h4>${kv(T.payCash.map(([k,v])=>[k,roleOf(v)]))}`,true)}
   ${acc('g-onsite','현장 결제 한눈에',esc(T.payTableNote),`<div class="ptwrap"><table class="pt"><thead><tr><th scope="col">날</th><th scope="col">장소</th><th scope="col">결제</th><th scope="col">금액</th></tr></thead><tbody>${Object.entries(byDay).map(([d,rs])=>rs.map(r=>`<tr><td class="tn">${esc(d)}</td><th scope="row">${esc(r.place)}</th><td class="${r.c==='cash'?'cash':''}">${esc(r.pay)}</td><td>${esc(r.amt)}</td></tr>`).join('')).join('')}</tbody></table></div><p class="p" style="font-size:14px">${esc(T.payFine)}</p>`)}
   ${acc('g-todo','출발 전 할 일','<span id="todoN"></span>',`<ul class="cl">${T.todos.map(t=>chk(t.id,`${esc(t.b)}<small>${esc(t.s)}</small>`)).join('')}</ul><p class="p" style="font-size:14px">${esc(T.done)}</p>`)}
   ${acc('g-pack','준비물','<span id="packN"></span>',`<ul class="cl two">${T.packing.map(p=>chk(p.id,esc(p.t))).join('')}</ul>`)}
   ${acc('g-air','공항 흐름','',`<ol class="steps">${T.steps.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${esc(s.w)}</b><p>${s.note}</p></div></li>`).join('')}</ol>`)}
   ${acc('g-car','렌터카','',kv(T.rental.map(([k,v])=>[k,v.replace(/ class="mapbtn"/,'').replace(/<span aria-hidden="true">↗<\/span>/,' ↗')])))}
   ${acc('info','연락처','누르면 번호 복사',`<ul class="ct">${T.contacts.map(c=>`<li><div><b>${esc(c.who)}</b><br><span class="num">${esc(c.num)}</span></div><button type="button" class="copy" data-copy="${esc(c.num)}" aria-label="${esc(c.who)} 번호 복사">복사</button></li>`).join('')}</ul>`)}
   ${acc('g-drive','일본 운전','한국과 다른 점',kv(T.driving))}
   ${acc('g-shop','쇼핑','',`${kv(T.shopping)}<h4>하나만 고른다면</h4><ol class="rank">${T.rank.map((r,i)=>`<li><span class="n">${i+1}</span><div><b>${esc(r.b)}</b><p>${esc(r.s)}</p></div></li>`).join('')}</ol><p class="p" style="font-size:14px">${esc(T.taxfree)}<sup>3</sup></p>`)}
  </div>
 </div></section>`}

function footer(){return `<div class="w"><ol>
  <li id="fn1">${esc(T.wxNote)}</li>
  <li id="fn2">${esc(T.stayFine)}</li>
  <li id="fn3">면세 금액은 같은 점포 합계 기준이며, 소모품은 귀국까지 개봉하지 않아야 해요.</li>
 </ol><p>${esc(T.foot)}</p></div>`}

// ---------- weather band ----------
function freshness(){if(WX.live)return '실시간 예보 · open-meteo';if(!WX.updated)return '예보 데이터 준비 중이에요.';const t=new Date(WX.updated).getTime();const o=jst(t);const s=`${o.m}/${o.d} ${String(o.h).padStart(2,'0')}:${String(o.mi).padStart(2,'0')} 업데이트 · ${WX.src||'MET Norway · 일본 기상청'}`;return phase==='after'?s+' · 여행 직전 예보 기록':((Date.now()-t)/3600e3>4?s+' · 오래된 예보일 수 있어요':s)}
function hours(loc,date,hl){const [s,e]=winT(date,6,24);const R=inWin(loc,s,e);if(!R.length)return '';const nowT=Date.now();
 return `<div><p class="hrs-h">${esc(LOC[loc])}</p><div class="hrs">${R.map(r=>{const o=jst(r.t);const pr=+r.pr||0;const inw=hl&&o.h>=hl[0]-(r.dur>1?r.dur-1:0)&&o.h<hl[1];const isNow=nowT>=r.t&&nowT<r.t+r.dur*3600e3;
  return `<div class="hr${r.dur>1?' wide':''}${inw?' in':''}"><span class="h">${isNow?'지금':r.dur>1?`${o.h}–${Math.min(24,o.h+r.dur)}시`:`${o.h}시`}</span>${icon(r.sym,24)}<span class="t">${r.temp!=null?Math.round(r.temp)+'°':'—'}</span><span class="mm${pr>0?' r':''}">${pr>0?pr+'mm':'–'}</span></div>`}).join('')}</div></div>`}
function renderWx(){
 $$('[data-wxfresh]').forEach(e=>e.textContent=freshness());
 const open=+(store.get('wxday')||curDay||0);
 $('#wxd').innerHTML=PLAN.map(d=>{const a=dayAgg(d),o=dOf(d.n);const ex=d.n===open;const locs=[...new Set(d.items.map(i=>i.loc))];
  return `<li><button type="button" class="wxr" aria-expanded="${ex}" aria-controls="wxp-${d.n}" data-wx="${d.n}"><span class="d"><b>Day ${d.n} · ${o.w}</b><small>${esc(dayWord(d))}</small></span>${icon(a.sym||null,36)}<span class="tt">${a.sym?`${Math.round(a.tmax)}° <span>${Math.round(a.tmin)}°</span>`:'—'}</span><span class="ex" aria-hidden="true">+</span></button>
  <div class="wxp" id="wxp-${d.n}"${ex?'':' hidden'}><ul>${d.items.map(it=>vrHtml(it,d.date)).join('')}</ul>${locs.map(l=>hours(l,d.date,d.items.find(i=>i.loc===l).h)).join('')}<p class="hint">진한 칸이 일정 시간대예요. 며칠 뒤 날짜는 6시간 단위로 보여요.</p></div></li>`}).join('');
 $$('[data-wxday]').forEach(el=>{const d=PLAN.find(p=>p.n==el.dataset.wxday);el.innerHTML=d.items.map(it=>vrHtml(it,d.date)).join('')});
 $$('[data-wxmini]').forEach(el=>{const d=PLAN.find(p=>p.n==el.dataset.wxmini);const a=dayAgg(d);el.innerHTML=a.sym?`${icon(a.sym,28)}<span>${Math.round(a.tmax)}° / ${Math.round(a.tmin)}° · ${symOf(a.sym)[0]}<small>${esc(dayWord(d))}</small></span>`:'<span>예보 전</span>'});
}
const WMO=c=>c==0?'clearsky':c==1?'fair':c==2?'partlycloudy':c==3?'cloudy':(c==45||c==48)?'fog':(c>=51&&c<=57)?'lightrain':c==61?'lightrain':c==63?'rain':(c==65||c==66||c==67)?'heavyrain':(c>=71&&c<=77)?'snow':c==80?'lightrainshowers':c==81?'rainshowers':c==82?'heavyrainshowers':(c>=85&&c<=86)?'snow':c>=95?'rainandthunder':'cloudy';
async function tryLive(){try{const keys=Object.keys(LL);const u='https://api.open-meteo.com/v1/forecast?latitude='+keys.map(k=>LL[k][0]).join(',')+'&longitude='+keys.map(k=>LL[k][1]).join(',')+'&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,is_day&wind_speed_unit=ms&timezone=GMT&start_date=2026-09-24&end_date=2026-10-01';
 const ctl=new AbortController();setTimeout(()=>ctl.abort(),7000);const res=await fetch(u,{signal:ctl.signal});if(!res.ok)return false;let j=await res.json();if(!Array.isArray(j))j=[j];
 const loc={};keys.forEach((k,i)=>{const h=j[i]&&j[i].hourly;if(!h)return;loc[k]={u:new Date().toISOString(),r:h.time.map((t,n)=>[t+':00Z',h.temperature_2m[n],h.wind_speed_10m[n],h.precipitation[n],WMO(h.weather_code[n])+(h.is_day[n]?'_day':'_night'),h.precipitation_probability[n]])}});
 if(Object.keys(loc).length<4)return false;WX={live:true,updated:new Date().toISOString(),src:'open-meteo',loc,pop:{}};for(const k in CACHE)delete CACHE[k];return true}catch(e){return false}}



// ---------- build ----------
$('#app').innerHTML=hero()+gallery()+ethos()+T.days.map(chapter).join('')+weather()+stays()+guide();
document.body.insertAdjacentHTML('beforeend',T.days.map(sheet).join(''));
$('#foot').innerHTML=footer();
{const st=$('#status');
 if(phase==='before')st.innerHTML=`출발까지 <b>${-diff}일</b> · 9월 26일 청주 13:20`;
 else if(phase==='during'){st.innerHTML=`여행 <b>${curDay}일째</b>`;const c=$('#cta');c.textContent='오늘 일정';c.href='#d'+curDay}
 else st.textContent='2026년 9월 26일 – 30일 · 잘 다녀왔어요.';}
if(curDay){let nx=null;$$(`#d${curDay} .hl li`).filter(li=>li.dataset.m!=='').forEach(li=>{const m=+li.dataset.m;if(m<nowMin-40)li.classList.add('past');else if(!nx)nx=li});if(nx){nx.classList.add('next');$('#status').innerHTML+=` · 다음 ${esc($('.t',nx).textContent)} ${esc($('.tw',nx).textContent)}`}}

// nav
const menu=$('#lnavMenu'),links=$('#lnavLinks');
menu.addEventListener('click',()=>{const o=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',o);links.classList.toggle('open',o)});
links.addEventListener('click',e=>{if(e.target.closest('a')){menu.setAttribute('aria-expanded','false');links.classList.remove('open')}});

// gallery paddles
const gal=$('#gal'),gp=$('#galPrev'),gn=$('#galNext');
function galState(){gp.disabled=gal.scrollLeft<8;gn.disabled=gal.scrollLeft+gal.clientWidth>=gal.scrollWidth-8}
const step=()=>{const c=gal.querySelector('.gc');return c?c.getBoundingClientRect().width+20:300};
gp.addEventListener('click',()=>gal.scrollBy({left:-step(),behavior:'smooth'}));
gn.addEventListener('click',()=>gal.scrollBy({left:step(),behavior:'smooth'}));
gal.addEventListener('scroll',galState,{passive:true});galState();

// sheets
let lastFocus=null;
function openSheet(n){const d=document.getElementById('sheet-'+n);if(!d)return;lastFocus=document.activeElement;if(d.showModal)d.showModal();else d.setAttribute('open','');document.documentElement.style.overflow='hidden';d.scrollTop=0}
function closeSheet(d){if(d.close)d.close();else d.removeAttribute('open')}
$$('dialog.sheet').forEach(d=>{d.addEventListener('close',()=>{document.documentElement.style.overflow='';lastFocus&&lastFocus.focus&&lastFocus.focus()});d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))closeSheet(d)})});

document.addEventListener('click',e=>{
 const p=e.target.closest('[data-sheet]');if(p){openSheet(p.dataset.sheet);return}
 const r=e.target.closest('.wxr');if(r){const ex=r.getAttribute('aria-expanded')!=='true';r.setAttribute('aria-expanded',ex);$('#wxp-'+r.dataset.wx).hidden=!ex;if(ex)store.set('wxday',r.dataset.wx);return}
 const s=e.target.closest('[data-st]');if(s){$$('[data-st]').forEach(b=>b.setAttribute('aria-selected',b===s));$$('#stay .stay').forEach((pn,i)=>pn.hidden=i!=+s.dataset.st);return}
 const v=e.target.closest('.vbtn');if(v){const sh=v.closest('.sheet');$$('.vbtn',sh).forEach(x=>x.setAttribute('aria-pressed',x===v));$$('.vpanel',sh).forEach(pn=>pn.hidden=pn.dataset.v!==v.dataset.v);store.set('d2v2',v.dataset.v);return}
 const c=e.target.closest('.copy');if(c){const done=()=>{c.textContent='복사됨';setTimeout(()=>c.textContent='복사',1500)};const sel=()=>{const n=c.parentElement.querySelector('.num');const rg=document.createRange();rg.selectNodeContents(n);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c.dataset.copy).then(done,sel);else sel()}
});
{const v=store.get('d2v2');if(v){const b=$(`.vbtn[data-v="${v}"]`);b&&b.click()}}

// checklists share keys with the original page
function counts(){const left=s=>$$(s+' input').filter(i=>!i.checked).length;$('#todoN').textContent=`${left('#g-todo')}개 남음`;$('#packN').textContent=`${left('#g-pack')}개 남음`}
$$('.cl input').forEach(i=>{i.checked=store.get(i.dataset.k)==='1';i.addEventListener('change',()=>{store.set(i.dataset.k,i.checked?'1':'0');counts()})});counts();

renderWx();
// hash: scroll to the chapter or section, and open the matching accordion
try{history.scrollRestoration='manual'}catch(e){}
const h=(location.hash||'').slice(1);
if(h){const el=document.getElementById(h);if(el){if(el.tagName==='DETAILS')el.open=true;requestAnimationFrame(()=>el.scrollIntoView())}}
tryLive().then(ok=>{if(ok)renderWx()});
})();
</script>

</body></html>
